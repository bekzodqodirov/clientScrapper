[project]
name = "clientscrapper"
version = "0.1.0"
description = "GSR Logistics client-finding agent"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = [".venv", "venv", "alembic/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Deliberately multilingual: Uzbek ʻ/ʼ, Cyrillic keywords, en dashes in
    # prose. The ambiguous-unicode rules flag all of it as a typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
# The strict gate (07 §2.3): pure modules only. Each new pure module joins
# `files` in the task that adds it; bot handlers, Telethon code and Alembic
# stay outside (imported modules are analysed, their own errors not reported).
python_version = "3.12"
strict = true
follow_imports = "silent"
warn_unreachable = true
files = [
    "clientscrapper/config.py",
    "clientscrapper/logs.py",
    "clientscrapper/db",
    "clientscrapper/services/lifecycle.py",
    "clientscrapper/tools/doctor.py",
    # T-03
    "clientscrapper/services/text.py",
    "clientscrapper/services/keys.py",
    "clientscrapper/services/normalise.py",
    "clientscrapper/services/names.py",
    "clientscrapper/collectors/keywords.py",
    # T-06
    "clientscrapper/services/usage.py",
    "clientscrapper/services/costs.py",
    # T-05
    "clientscrapper/services/retry.py",
    "clientscrapper/services/http.py",
    "clientscrapper/services/robots.py",
    "clientscrapper/services/urlsafe.py",
    "clientscrapper/services/evidence.py",
    "clientscrapper/services/health.py",
    "clientscrapper/collectors/base.py",
    "clientscrapper/collectors/runner.py",
    "clientscrapper/tools/scrub_fixture.py",
    "clientscrapper/tools/record_fixture.py",
    # T-04: the gate scripts are pure too
    "scripts/secret_scan.py",
    "scripts/check_compose_env.py",
    # T-01/T-02 review
    "scripts/revision_id.py",
    # T-08
    "clientscrapper/services/crontab.py",
    "clientscrapper/services/backup.py",
    "clientscrapper/services/restore_drill.py",
    "clientscrapper/tools/restore.py",
    "clientscrapper/tools/healthcheck.py",
    # T-17
    "clientscrapper/services/companies.py",
    "clientscrapper/services/contacts.py",
    # T-13: the reader's Telethon-free modules (its Telethon code stays out)
    "clientscrapper/services/chats.py",
    "clientscrapper/userbot/prefilter.py",
    "clientscrapper/userbot/limits.py",
    # T-09
    "clientscrapper/services/erp_feeds.py",
    "clientscrapper/collectors/erp_sync.py",
    "clientscrapper/tools/erp_sync.py",
    # T-11
    "clientscrapper/services/client_import.py",
    "clientscrapper/tools/import_clients.py",
    # T-10
    "clientscrapper/services/outcomes.py",
    # T-18
    "clientscrapper/services/signals.py",
    "clientscrapper/services/scoring.py",
    "clientscrapper/services/candidates.py",
    # T-19
    "clientscrapper/services/suppression.py",
    "clientscrapper/services/gates.py",
    "clientscrapper/services/push_gate.py",
    # T-28
    "clientscrapper/services/crm_push.py",
    "clientscrapper/tools/push_test.py",
    # T-14
    "clientscrapper/collectors/telegram_monitor.py",
    # T-15
    "clientscrapper/services/pseudonyms.py",
    "clientscrapper/services/schemas.py",
    "clientscrapper/services/prompts.py",
    "clientscrapper/services/validators.py",
    "clientscrapper/services/extraction.py",
    "clientscrapper/services/classify.py",
    # T-16
    "clientscrapper/services/model_jobs.py",
    # T-20: the bot's pure halves (handlers and main stay out, like MIYA's)
    "clientscrapper/bot/callbacks.py",
    "clientscrapper/bot/texts.py",
    "clientscrapper/services/cards.py",
    "clientscrapper/services/owner.py",
]

# APScheduler 3 ships no type information.
[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:clientscrapper.*"]
markers = [
    "live: real network, run only from the VPS with LIVE=1 (make smoke)",
    "slow: seeds large data; runs only with CS_RUN_SLOW=1",
]
