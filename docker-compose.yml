# VENDORED_FROM dailyJournal@6b1f67f docker-compose.yml
# 06 §3.1. No service publishes a port to the network: the only host binding
# is Postgres on 127.0.0.1 for `make psql`.
name: clientscrapper
# A VPS that runs for a year must not fill its disk with container logs.
x-logging: &log { driver: json-file, options: { max-size: "10m", max-file: "3" } }
# An app container's healthcheck timing: one read of one heartbeat row a
# minute; three misses in a row after the threshold mark it unhealthy.
x-beat: &beat { interval: 60s, timeout: 20s, retries: 3, start_period: 120s }
x-app: &app
  build: .
  # unless-stopped, not on-failure: on-failure containers are NOT restored
  # after a VPS reboot. Every process idles rather than exits when it has
  # nothing to do, so this never becomes a restart loop.
  restart: unless-stopped
  env_file: .env
  logging: *log
  environment: { TZ: "${TIMEZONE:-Asia/Tashkent}" }
  volumes: [ "./data:/data", "./secrets:/app/secrets:ro" ]
  depends_on:
    db:   { condition: service_healthy }
    init: { condition: service_completed_successfully }
services:
  db:
    image: postgres:16            # plain postgres: no pgvector, no embeddings in this project
    restart: unless-stopped
    # Under memory pressure the kernel picks something else than the database.
    oom_score_adj: -500
    mem_limit: 1536m
    logging: *log
    environment: { POSTGRES_USER: "${POSTGRES_USER:-clientscrapper}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}", POSTGRES_DB: "${POSTGRES_DB:-clientscrapper}", TZ: "${TIMEZONE:-Asia/Tashkent}" }
    command: ["postgres", "-c", "shared_buffers=384MB", "-c", "work_mem=16MB", "-c", "timezone=Asia/Tashkent", "-c", "log_min_duration_statement=2000"]
    volumes: [ "db_data:/var/lib/postgresql/data" ]
    ports: [ "127.0.0.1:${DB_PORT:-5433}:5432" ]   # localhost only; 5433 because MIYA may hold 5432 on the same VPS
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientscrapper} -d ${POSTGRES_DB:-clientscrapper}"], interval: 5s, timeout: 5s, retries: 20 }
  # A fresh clone has no ./data or ./secrets (both gitignored), so Docker
  # creates the bind-mount roots root-owned while every app container runs as
  # uid 10001. This runs once, as root, hands them over, then migrates. The
  # chown is best-effort: on Docker Desktop the mount is already permissive
  # and chown can fail outright, and every app service waits on this one
  # *completing successfully*.
  init:
    build: .
    user: root
    env_file: .env
    logging: *log
    depends_on: { db: { condition: service_healthy } }
    volumes: [ "./data:/data", "./secrets:/secrets" ]
    command: ["sh", "-c", "mkdir -p /data/evidence /data/backups /data/imports && { chown -R 10001:10001 /data /secrets || echo 'chown skipped'; } && su -s /bin/sh clientscrapper -c 'alembic upgrade head'"]
    restart: "no"
  # Docker's «healthy» for an app container is «running, and a fresh
  # heartbeat» (06 §4.1): tools/healthcheck.py asks health.judge, the same
  # rule the health job alerts on, so `make ps` and the owner's alert agree.
  # The first beat comes within a minute of start; start_period covers it.
  worker:
    <<: *app
    mem_limit: 2g
    cpus: 2.0
    command: ["python", "-m", "clientscrapper.worker.main"]
    healthcheck: { <<: *beat, test: ["CMD", "python", "-m", "clientscrapper.tools.healthcheck", "worker"] }
  userbot:
    <<: *app
    mem_limit: 768m
    cpus: 0.5
    command: ["python", "-m", "clientscrapper.userbot.main"]
    healthcheck: { <<: *beat, test: ["CMD", "python", "-m", "clientscrapper.tools.healthcheck", "userbot"] }
  bot:
    <<: *app
    mem_limit: 512m
    cpus: 0.5
    command: ["python", "-m", "clientscrapper.bot.main"]
    healthcheck: { <<: *beat, test: ["CMD", "python", "-m", "clientscrapper.tools.healthcheck", "bot"] }
  # `make smoke` (07 §1.12): the live tests, one real request per collector, from
  # the VPS only — weekly and quarterly by the host's cron (`make smoke-cron`).
  # The Dockerfile's smoke stage (the app plus pytest and tests/); it writes
  # nothing but collector_runs rows (services/smoke.py) and runs only when
  # asked: no restart, nobody's dependency.
  smoke:
    <<: *app
    build: { context: ., target: smoke }
    # The db only: never init, whose run is `chown -R` over the evidence and
    # `alembic upgrade head` on the live database — a Sunday cron after a
    # `git pull` with no `make update` would migrate it under the old
    # worker, bot and userbot, with no backup first (`make smoke` also runs
    # with --no-deps; seam review wave 4).
    depends_on: { db: { condition: service_healthy } }
    profiles: ["smoke"]
    restart: "no"
    mem_limit: 768m
    cpus: 0.5
    environment: { TZ: "${TIMEZONE:-Asia/Tashkent}", LIVE: "1" }
    command: ["python", "-m", "pytest", "-q", "-rs", "-p", "no:cacheprovider", "-m", "live and not quarterly", "tests/live"]
  searxng:                         # optional: docker compose --profile searxng up -d
    image: searxng/searxng:2026.10.1      # UNVERIFIED tag — pin the current one on day 1
    profiles: ["searxng"]
    restart: unless-stopped
    mem_limit: 512m
    logging: *log
    volumes: [ "./searxng:/etc/searxng:ro" ]   # settings.yml: json format on, limiter off, engines duckduckgo,startpage,mojeek,brave; Google/Bing disabled (03 §2.1)
    # no ports: reachable only as http://searxng:8080 inside the compose network
volumes: { db_data: {} }
