# VENDORED_FROM dailyJournal@6b1f67f alembic.ini
[alembic]
script_location = alembic
prepend_sys_path = .
# 02 §5: migrations are 000N_<slug>.py; `make revision` mints the id
# (scripts/revision_id.py) and the file is named after it alone.
file_template = %%(rev)s
version_path_separator = os
# sqlalchemy.url is intentionally omitted — alembic/env.py reads DATABASE_URL.

[post_write_hooks]
# exec, not console_scripts: ruff ships a binary with no Python entry point,
# so the console_scripts lookup cannot find it.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
